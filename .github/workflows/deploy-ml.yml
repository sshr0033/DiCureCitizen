name: Deploy ML Service to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and Push Docker image
        working-directory: ml
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY }}/ml-app:latest .
          docker push ${{ secrets.AZURE_REGISTRY }}/ml-app:latest

      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.AZURE_REGISTRY }}/ml-app:latest
